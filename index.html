<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAEP Math Score Distribution Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f9f7f4;
    --surface: #ffffff;
    --surface2: #f0ede8;
    --border: #e2ddd6;
    --text: #1a1714;
    --muted: #8c8075;
    --col2024: #b41e1e;
    --col2013: #3b6ea5;
    --shift-pos: #16a34a;
    --shift-neg: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 28px 40px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
    background: var(--surface);
  }
  header h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text);
  }
  header .sub {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }
  .controls {
    padding: 16px 40px;
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .controls label {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  select {
    background: var(--surface);
    color: var(--text);
    border: 1.5px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    cursor: pointer;
    outline: none;
  }
  select:focus { border-color: var(--col2013); }

  /* Grade toggle */
  .grade-toggle {
    display: flex;
    gap: 4px;
    background: var(--surface2);
    border-radius: 8px;
    padding: 4px;
  }
  .grade-btn {
    padding: 6px 18px;
    border: none;
    border-radius: 6px;
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    background: transparent;
    color: var(--muted);
    transition: all 0.15s;
    letter-spacing: 0.02em;
  }
  .grade-btn.active {
    background: var(--surface);
    color: var(--text);
    box-shadow: 0 1px 4px rgba(0,0,0,0.12);
  }

  .legend {
    display: flex;
    gap: 16px;
    margin-left: auto;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
  }
  .legend-swatch {
    width: 22px;
    height: 3px;
    border-radius: 2px;
  }
  .swatch-2013 { background: var(--col2013); }
  .swatch-2024 { background: var(--col2024); }

  .main {
    flex: 1;
    padding: 24px 40px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .stat-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .stat-value {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1;
  }
  .stat-sub {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    margin-top: 5px;
  }
  .stat-value.pos { color: var(--shift-pos); }
  .stat-value.neg { color: var(--shift-neg); }

  .chart-container {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    width: 100%;
  }
  canvas#chart {
    display: block;
    width: 100%;
    height: 340px;
  }

  .tooltip {
    position: fixed;
    background: rgba(26,23,20,0.92);
    color: #fff;
    border-radius: 8px;
    padding: 10px 14px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.1s;
    z-index: 100;
    line-height: 1.7;
    white-space: nowrap;
  }
</style>
</head>
<body>

<header>
  <h1>NAEP Math Score Distribution Explorer</h1>
  <span class="sub">State-by-State · 2013 vs 2024</span>
</header>

<div class="controls">
  <label for="stateSelect">State / Jurisdiction</label>
  <select id="stateSelect"></select>

  <div style="display:flex;align-items:center;gap:8px;">
    <label>Grade</label>
    <div class="grade-toggle">
      <button class="grade-btn" id="btn4" onclick="setGrade(4)">4th</button>
      <button class="grade-btn active" id="btn8" onclick="setGrade(8)">8th</button>
    </div>
  </div>

  <div class="legend">
    <div class="legend-item">
      <div class="legend-swatch swatch-2013"></div>
      <span>2013</span>
    </div>
    <div class="legend-item">
      <div class="legend-swatch swatch-2024"></div>
      <span>2024</span>
    </div>
  </div>
</div>

<div class="main">
  <div class="stats-row" id="statsRow"></div>
  <div class="chart-container" id="chartContainer">
    <canvas id="chart"></canvas>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

// Grade-specific x-axis cutoffs (bin index)
const X_MAX = { 4: 36, 8: 42 };

const canvas = document.getElementById('chart');

function getGradeData() {
  return currentGrade === 8 ? MATH_DATA.grade8 : MATH_DATA.grade4;
}

function populateSelect() {
  const gdata = getGradeData();
  const jurs = Object.keys(gdata).sort((a,b) => {
    if (a === 'National') return -1;
    if (b === 'National') return 1;
    return a.localeCompare(b);
  });
  stateSelect.innerHTML = '';
  jurs.forEach(j => {
    const opt = document.createElement('option');
    opt.value = j;
    opt.textContent = j;
    if (j === currentState) opt.selected = true;
    stateSelect.appendChild(opt);
  });
}

function setGrade(g) {
  currentGrade = g;
  document.getElementById('btn4').classList.toggle('active', g === 4);
  document.getElementById('btn8').classList.toggle('active', g === 8);
  // Keep same state if available, else fall back to National
  const gdata = getGradeData();
  if (!gdata[currentState]) currentState = 'National';
  populateSelect();
  update();
}

function gaussSmooth(data, sigma) {
  const r = Math.ceil(sigma * 3);
  const kernel = [];
  let sum = 0;
  for (let i = -r; i <= r; i++) {
    const v = Math.exp(-0.5*(i/sigma)**2);
    kernel.push(v);
    sum += v;
  }
  const k = kernel.map(v => v/sum);
  return data.map((_, idx) => {
    let s = 0;
    for (let i = -r; i <= r; i++) {
      const di = idx + i;
      const val = (di >= 0 && di < data.length) ? data[di] : 0;
      s += val * k[i + r];
    }
    return s;
  });
}

function computeBelow(data, threshScore) {
  const threshIdx = Math.floor(threshScore / 10);
  let below = 0, total = 0;
  for (let i = 0; i < data.length; i++) {
    total += data[i];
    if (i < threshIdx) below += data[i];
  }
  return total > 0 ? (below / total * 100).toFixed(1) : 0;
}

function updateStats(stateName) {
  const gdata = getGradeData();
  const sd = gdata[stateName];
  const nat = gdata['National'];
  const mean24 = sd.avg2024;
  const mean13 = sd.avg2013;
  const diff = mean24 - mean13;
  const diffLabel = (diff >= 0 ? '+' : '') + diff.toFixed(1);
  const diffClass = diff >= 0 ? 'pos' : 'neg';

  const natDiff = (nat.avg2024 - nat.avg2013).toFixed(1);
  const natDiffFmt = (natDiff >= 0 ? '+' : '') + natDiff;

  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card">
      <div class="stat-label">Avg Score 2013</div>
      <div class="stat-value">${mean13.toFixed(1)}</div>
      <div class="stat-sub">National: ${nat.avg2013.toFixed(1)}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Avg Score 2024</div>
      <div class="stat-value">${mean24.toFixed(1)}</div>
      <div class="stat-sub">National: ${nat.avg2024.toFixed(1)}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Change 2013→2024</div>
      <div class="stat-value ${diffClass}">${diffLabel}</div>
      <div class="stat-sub">National: ${natDiffFmt}</div>
    </div>
  `;
}

function drawChart(stateName) {
  const gdata = getGradeData();
  const sd = gdata[stateName];
  const d24raw = sd['2024'];
  const d13raw = sd['2013'];
  const X_MAX_IDX = X_MAX[currentGrade];

  const dpr = window.devicePixelRatio || 1;
  const cw = canvas.clientWidth;
  const ch = canvas.clientHeight || 340;
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  canvas.width = cw * dpr;
  canvas.height = ch * dpr;
  ctx.scale(dpr, dpr);

  const padL = 40, padR = 16, padT = 46, padB = 44;
  const plotW = cw - padL - padR;
  const plotH = ch - padT - padB;

  const d24 = gaussSmooth(d24raw, 1.5);
  const d13 = gaussSmooth(d13raw, 1.5);
  const maxVal = Math.max(...d24.slice(0, X_MAX_IDX+1), ...d13.slice(0, X_MAX_IDX+1)) * 1.1;

  ctx.clearRect(0, 0, cw, ch);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, cw, ch);

  // Title
  ctx.fillStyle = '#2a2420';
  ctx.font = `bold 13px 'Syne', sans-serif`;
  ctx.textAlign = 'left';
  ctx.fillText('Score Distribution, 2013 versus 2024', padL, 10);

  // Source note
  ctx.fillStyle = '#a09488';
  ctx.font = `9px 'Space Mono', monospace`;
  ctx.textAlign = 'left';
  ctx.fillText('Source: NAEP Grade ' + currentGrade + ' math scores', padL, ch - 2);

  // Grid lines
  ctx.strokeStyle = '#ede9e3';
  ctx.lineWidth = 1;
  const yTicks = 4;
  for (let i = 0; i <= yTicks; i++) {
    const y = padT + plotH - (i / yTicks) * plotH;
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(padL + plotW, y);
    ctx.stroke();
    if (i > 0) {
      ctx.fillStyle = '#a09488';
      ctx.font = `bold 9px 'Space Mono', monospace`;
      ctx.textAlign = 'right';
      ctx.fillText(Math.round(i / yTicks * maxVal) + '%', padL - 5, y + 3);
    }
  }

  function idxToX(i) { return padL + (i / X_MAX_IDX) * plotW; }
  function valToY(v) { return padT + plotH - (v / maxVal) * plotH; }

  function drawArea(data, color, fillColor) {
    ctx.beginPath();
    ctx.moveTo(idxToX(0), valToY(0));
    for (let i = 0; i <= X_MAX_IDX; i++) {
      const x = idxToX(i);
      const y = valToY(data[i] || 0);
      if (i === 0) {
        ctx.moveTo(x, y);
      } else {
        const px = idxToX(i - 1);
        const py = valToY(data[i-1] || 0);
        const mx = (px + x) / 2;
        ctx.quadraticCurveTo(px, py, mx, (py + y) / 2);
      }
    }
    ctx.lineTo(idxToX(X_MAX_IDX), valToY(0));
    ctx.closePath();
    ctx.fillStyle = fillColor;
    ctx.fill();

    // Stroke line
    ctx.beginPath();
    for (let i = 0; i <= X_MAX_IDX; i++) {
      const x = idxToX(i);
      const y = valToY(data[i] || 0);
      if (i === 0) {
        ctx.moveTo(x, y);
      } else {
        const px = idxToX(i - 1);
        const py = valToY(data[i-1] || 0);
        const mx = (px + x) / 2;
        ctx.quadraticCurveTo(px, py, mx, (py + y) / 2);
      }
    }
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  drawArea(d13, '#3b6ea5', 'rgba(59,110,165,0.15)');
  drawArea(d24, '#b41e1e', 'rgba(180,30,30,0.15)');

  // Mean lines
  const mean24 = sd.avg2024;
  const mean13 = sd.avg2013;
  function scoreToX(s) { return padL + ((s / 10) / X_MAX_IDX) * plotW; }

  [{ mean: mean13, color: '#3b6ea5' }, { mean: mean24, color: '#b41e1e' }].forEach(({mean, color}) => {
    const mx = scoreToX(mean);
    ctx.setLineDash([4, 3]);
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(mx, padT);
    ctx.lineTo(mx, padT + plotH);
    ctx.stroke();
    ctx.setLineDash([]);
  });

  // Bracket annotation
  const mx24 = scoreToX(mean24);
  const mx13 = scoreToX(mean13);
  const diff = mean24 - mean13;
  const diffLabel = (diff >= 0 ? '+' : '') + diff.toFixed(1);
  const midX = (mx24 + mx13) / 2;

  ctx.fillStyle = '#666';
  ctx.font = `bold 10px 'Space Mono', monospace`;
  ctx.textAlign = 'center';

  ctx.strokeStyle = '#aaa';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(Math.min(mx24, mx13), padT - 8);
  ctx.lineTo(Math.max(mx24, mx13), padT - 8);
  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(mx24, padT - 5); ctx.lineTo(mx24, padT - 11); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(mx13, padT - 5); ctx.lineTo(mx13, padT - 11); ctx.stroke();

  ctx.fillStyle = diff >= 0 ? '#16a34a' : '#dc2626';
  ctx.fillText(diffLabel, midX, padT - 15);

  // X-axis labels
  ctx.fillStyle = '#a09488';
  ctx.font = `9px 'Space Mono', monospace`;
  ctx.textAlign = 'center';
  const step = currentGrade === 8 ? 5 : 5;
  for (let i = 0; i <= X_MAX_IDX; i += step) {
    ctx.fillText(bins[i].split('-')[0], idxToX(i), ch - 22);
  }
  ctx.fillText((X_MAX_IDX * 10).toString(), idxToX(X_MAX_IDX), ch - 22);
}

function getBinAtX(x, cw) {
  const padL = 40, padR = 16;
  const plotW = cw - padL - padR;
  const X_MAX_IDX = X_MAX[currentGrade];
  const frac = (x - padL) / plotW;
  return Math.max(0, Math.min(X_MAX_IDX - 1, Math.floor(frac * X_MAX_IDX)));
}

canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const cw = canvas.style.width ? parseInt(canvas.style.width) : canvas.clientWidth;
  const ch = canvas.style.height ? parseInt(canvas.style.height) : canvas.clientHeight;
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const padL = 40, padR = 16, padT = 46, padB = 44;
  if (x < padL || x > cw - padR || y < padT || y > ch - padB) {
    tooltip.style.opacity = 0;
    return;
  }
  const binIdx = getBinAtX(x, cw);
  const gdata = getGradeData();
  const sd = gdata[currentState];
  const v24 = (sd['2024'][binIdx] || 0).toFixed(1);
  const v13 = (sd['2013'][binIdx] || 0).toFixed(1);
  const diff = (parseFloat(v24) - parseFloat(v13)).toFixed(1);
  const diffFmt = (diff >= 0 ? '+' : '') + diff;
  const scoreRange = bins[binIdx];
  tooltip.innerHTML = `<b>${scoreRange}</b><br>2024: ${v24}%<br>2013: ${v13}%<br>Δ ${diffFmt}pp`;
  tooltip.style.opacity = 1;
  tooltip.style.left = (e.clientX + 14) + 'px';
  tooltip.style.top = (e.clientY - 10) + 'px';
});

canvas.addEventListener('mouseleave', () => { tooltip.style.opacity = 0; });

function update() {
  const gdata = getGradeData();
  if (!gdata[currentState]) currentState = 'National';
  updateStats(currentState);
  drawChart(currentState);
}

stateSelect.addEventListener('change', () => {
  currentState = stateSelect.value;
  update();
});

window.addEventListener('resize', update);

// Init
populateSelect();
update();
</script>
</body>
